name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Build knowledge base and embedding index
        run: python scraper/build_kb.py && python scripts/build_index.py
      - name: Deterministic tool & retrieval tests (no LLM calls)
        run: pytest -q tests
