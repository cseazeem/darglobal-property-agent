# Render's free plan sleeps after ~15 min idle; ping the health endpoint so reviewers
# don't hit a cold start. GitHub may delay scheduled runs by a few minutes.
name: Keep demo warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://darglobal-property-agent.onrender.com/api/health
